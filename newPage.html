<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>about me page</title>
        <link rel="stylesheet" href="style.css">
        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 20px;
                background-color: #EAF2F8;
            }
            h1 {
                color: #333;
            }
            form {
                background:#FFFFFF;
                padding: 20px;
                border-radius: 5px;
                box-shadow: 0 2px 5px rgba(0,0,0,0.1);
                color: #2C3E50;
            }
            label {
                display: block;
                margin-bottom: 10px;
                font-weight: bold;
            }
            input[type="text"],
            input[type="password"] {
                width: 100%;
                padding: 8px;
                margin-bottom: 20px;
                border: 1px solid #CCCCCC;
                border-radius: 4px;
            }
            input[type="submit"] {
                background-color: #28a745;
                color: white;
                padding: 10px 15px;
                border: none;
                border-radius: 4px;
                cursor: pointer;
            }
            input[type="submit"]:hover {
                background-color: #218838;
            }
            .radio-group{
            display: flex;
            gap: 15px;
            align-items: center;
           } 

        </style>
    </head> 
    <body onsubmit="return returnvalidation()">
        <h1>Volunteer Sign-up form</h1>
        <form>
            <fieldset>
                <legend>Personal Information</legend>
                <label for="FULL-NAME">FULL-NAME:</label>
                <input type="text" id="FULL-NAME" name="FULL-NAME" >
                <label for="email">EMAIL:</label>
                <input type="text" id="email" name="email" >                
                <label for="password">PASSWORD:</label>
                <input type="password" id="password" name="password" > 
            </fieldset>
            <fieldset class="radio-group">
                <legend>AVAILABILITY</legend>
                <input type="radio" id="morning" name="AVAILABILITY" value="morning">
                <label for="morning">MORNING</label>
                <input type="radio" id="afternoon" name="AVAILABILITY" value="afternoon">
                <label for="afternoon">AFTERNOON</label>
                <input type="radio" id="evening" name="AVAILABILITY" value="evening">
                <label for="evening">EVENING</label>                 
            </fieldset>
            <fieldset>
                <legend>EXPERIENCE</legend>
                <label for="experience">Choose your experience level:</label>
                <select name="experience" id="experience">
                    <option value="">--Please choose an option--</option>
                    <option value="beginner">Beginner</option>
                    <option value="intermediate">Intermediate</option>
                    <option value="expert">Expert</option>
                </select>
            </fieldset>
            <fieldset>
                <legend>BIO</legend>
                
                <textarea id="bio" name="bio" rows="5" cols="50">

                </textarea>

            </fieldset>
            <button type="submit">submit</button> <button type="reset">reset</button>
           
           
           <script type="text/javascript" >
            function returnvalidation(){
                
                var name=document.getElementById("FULL-NAME").value;
                var password=document.getElementById("password").value;
                var experience=document.getElementById("experience").value;  
                var email=document.getElementById("email").value; 
                console.log(experience);    
                //e.preventDefault();         
                if(name=="" || password==""|| experience==""||name.length<3|| password.length<6){
                    alert("fill all the required fields");
                    return false;
                }
                if(!email.includes("@") || !email.includes(".") ){
                    alert("please enter a valid email");
                    return false;
                }
                return true;
            }
           </script>

        </form>
    </body>
</html>
